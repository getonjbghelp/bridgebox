<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BridgeBox</title>
    <!--
      Everything below runs before the 433KB module bundle is even fetched, and
      that is the point. The window used to sit blank through WebView2 start-up,
      the bundle parse, and then App.tsx's own `return null` while get_config
      answered - React cannot shorten the first two, because none of its code
      has run yet. Static markup can, and the browser paints it the moment the
      document is parsed.
    -->
    <script>
      // Which theme to paint the skeleton in.
      //
      // config.yaml stays the single source of truth - MotionPrefsContext
      // overwrites this the instant get_config answers, and a mismatch
      // self-corrects within a frame. This is a render hint so the first paint
      // is not white on a machine set to dark; the very first launch of all has
      // no hint yet and gets "dark", matching UiConfig.theme's schema default
      // and what the setup wizard forces on a first run anyway - painting
      // "light" here for that one launch would just be a flash to correct.
      try {
        var hint = localStorage.getItem('bb-theme-hint')
        document.documentElement.dataset.theme = hint === 'light' ? 'light' : 'dark'
      } catch (e) {
        /* storage disabled - the default is correct often enough */
      }
    </script>
    <style>
      /* Duplicated from tokens.css rather than imported: a stylesheet is
         another round trip, and this has to paint on the first one. They must
         match EXACTLY - a skeleton two shades off the real background makes
         the handover to React look like a flash. test/bootSkeleton.test.ts
         reads both files and fails if they ever drift.
           --bb-boot-bg = --color-bg      (--slate-50  / --navy-950)
           --bb-boot-fg = --color-border  (--slate-200 / dark border) */
      :root {
        --bb-boot-bg: #f8fafc;
        --bb-boot-fg: #e2e8f0;
      }
      :root[data-theme='dark'] {
        --bb-boot-bg: #0a0f1e;
        --bb-boot-fg: #223049;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bb-boot-bg);
      }
      #bb-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* A plain ring spinner rather than the wordmark - a mark that pulses in
         place reads as "something is wrong with it", not "something is
         happening". Colour still comes from the same --bb-boot-fg the old
         logo used, so it stays theme-correct without a second lookup. */
      #bb-boot .bb-boot-spinner {
        display: block;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid var(--bb-boot-fg);
        border-top-color: transparent;
        animation: bb-boot-spin 800ms linear infinite;
      }
      @keyframes bb-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #bb-boot .bb-boot-spinner {
          animation: none;
        }
      }
      /* Removed by main.tsx once React has painted. Kept as a class rather than
         a node removal so the fade can finish without the element jumping.
         --dur-slow / --ease-standard from tokens.css, copied rather than imported
         for the same reason the colours above are - this has to be ready for
         the very first paint. Slower and gentler than the rest of the app's
         own transitions on purpose: this crossfade is the one moment a user
         is looking at nothing else, so a duration that reads as brisk
         everywhere else (see --dur-base) still reads as a cut here. */
      #bb-boot.bb-boot--done {
        opacity: 0;
        transition: opacity 500ms cubic-bezier(0.42, 0, 0.58, 1);
        pointer-events: none;
      }
      /* The real app, crossfading in under the skeleton as it fades out
         above (App.tsx toggles both classes in the same effect, one frame
         apart at most) - a plain opacity:1 the instant setupComplete
         resolves read as a hard cut the moment the skeleton's own fade
         started, because #root's content was already fully there
         underneath it. Starts invisible so nothing shows through the
         skeleton before this class is added. Same duration/easing as the
         skeleton's own fade-out above - two different timings crossfading
         against each other is what a mismatched handover actually looks like. */
      #root {
        opacity: 0;
        transition: opacity 500ms cubic-bezier(0.42, 0, 0.58, 1);
      }
      #root.bb-root--visible {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #root {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="bb-boot">
      <div class="bb-boot-spinner" role="status" aria-label="Загрузка"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
